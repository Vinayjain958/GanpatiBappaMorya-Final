# Render Blueprint — backend API only.
# Database: Supabase PostgreSQL (Session pooler URL — the direct
# db.<ref>.supabase.co host is IPv6-only and unreachable from Render).
# Frontend: Vercel (Root Directory: apps/web).
services:
  - type: web
    name: localens-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: apps/api
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      # ─── Core ───────────────────────────────────────────────────────────
      - key: APP_ENV
        value: production
      # Supabase Session pooler URI (port 5432, NOT the 6543 transaction pooler,
      # which breaks asyncpg prepared statements), with ?sslmode=require appended
      - key: DATABASE_URL
        sync: false
      - key: APP_SECRET_KEY
        generateValue: true
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Your Vercel URL. Any format works: https://x.vercel.app  or  ["https://x.vercel.app"]
      - key: CORS_ALLOW_ORIGINS
        sync: false

      # ─── Seeding: Supabase is already seeded. Only set "true" for one deploy
      # if you ever need to rebuild the catalog from scratch.
      - key: SEED_ON_STARTUP
        value: "false"
      - key: INDEX_EMBEDDINGS_ON_STARTUP
        value: "false"

      # ─── AI ─────────────────────────────────────────────────────────────
      - key: GEMINI_ENABLED
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_TEXT
        value: gemini-2.5-flash
      # Optional: Nugen domain model for Digital Twin explanations
      - key: NUGEN_API_KEY
        sync: false

      # ─── Optional third-party keys (fall back to mocks when blank) ─────
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: TICKETMASTER_API_KEY
        sync: false
      - key: MAPBOX_API_KEY
        sync: false
      - key: NOMINATIM_USER_AGENT
        sync: false
      - key: WIKIMEDIA_USER_AGENT
        sync: false

      # ─── Admin account (used only by scripts/create_admin.py) ──────────
      - key: ADMIN_SEED_EMAIL
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false
