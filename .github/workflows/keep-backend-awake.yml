# Render's free web services sleep after 15 minutes without traffic and take
# ~1 minute to wake, which surfaces as 502s on the first request. Ping the
# health endpoint every 10 minutes so the backend stays warm.
# (One always-on free service fits within Render's 750 free hours/month.)
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render health endpoint
        run: |
          curl --silent --show-error --max-time 120 --retry 3 --retry-delay 10 \
            https://ganpatibappamorya-final.onrender.com/api/v1/health || true
