[project]
name = "localens-api"
version = "0.1.0"
description = "LocaLens FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# Data-pipeline scripts (Overture ingestion, synthetic data, seeding) are
# not part of the typed application surface exercised by `mypy src`; they
# still must pass ruff and their own tests, but strict typing is relaxed
# here since they work heavily with loosely-typed external JSON/parquet data.
[[tool.mypy.overrides]]
module = "scripts.*"
strict = false
disallow_untyped_defs = false
check_untyped_defs = false
disallow_any_generics = false

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
